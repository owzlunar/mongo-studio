[package]
name = "mongo-studio"
version = "0.1.0"
edition = "2021"
authors = ["Mongo Studio Contributors"]
description = "VS Code-inspired MongoDB Desktop Admin Tool built with Rust and egui"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
egui_dock = { version = "0.12", features = ["serde"] }
egui_extras = { version = "0.27", features = ["svg"] }
egui-phosphor = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Phase 2+ dependencies
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time"] }
bson = "2.10"
mongodb = "2.8"
rfd = "0.14"
keyring = "2.3"
syntect = "5.2"

[features]
default = []
phase2-db = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
