name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: mongo-studio
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: mongo-studio
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mongo-studio.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mongo-studio

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-3-dev libdbus-1-dev libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive & checksum
        shell: bash
        run: |
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" staging/
          cp README.md LICENSE* staging/ 2>/dev/null || true

          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="mongo-studio-${{ matrix.name }}.zip"
            powershell -NoProfile -Command "Compress-Archive -Path 'staging/*' -DestinationPath 'dist/$archive' -Force"
            sha256sum "dist/$archive" > "dist/$archive.sha256"
          else
            archive="mongo-studio-${{ matrix.name }}.tar.gz"
            tar -czf "dist/$archive" -C staging .
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "dist/$archive" > "dist/$archive.sha256"
            else
              sha256sum "dist/$archive" > "dist/$archive.sha256"
            fi
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongo-studio-${{ matrix.name }}
          path: dist/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

